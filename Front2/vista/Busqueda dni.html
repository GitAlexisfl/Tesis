    <script>
        document.getElementById('search-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const searchValue = document.getElementById('dni').value;

            fetch('http://127.0.0.1:5000/pacientes/buscar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `dni=${encodeURIComponent(searchValue)}`
            })
                .then(response => {
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        return response.json();
                    } else {
                        throw new Error('La respuesta no es JSON');
                    }
                })
                .then(data => {
                    // console.log(data)
                    // const tableBody = document.getElementById('Pacientes');
                    // tableBody.innerHTML = '';

                    if (data.error) {
                        console.error(data.error);
                    } else {
                        // const row = document.createElement('tr');
                        // row.innerHTML = `
                        // <td>${data.nombres}</td>
                        // <td>${data.apellidoPaterno}</td>
                        // <td>${data.apellidoMaterno}</td>
                        // <td>${data.tipoDocumento}</td>
                        // <td>${data.numeroDocumento}</td>
                        // <td>${data.digitoVerificador}</td>
                        // `;
                        // tableBody.appendChild(row);


                        document.getElementById('nombres').value = data.nombres;
                        document.getElementById('apellidoPaterno').value = data.apellidoPaterno;
                        document.getElementById('apellidoMaterno').value = data.apellidoMaterno;
                        document.getElementById('numeroDocumento').value = data.numeroDocumento;
                        //document.getElementById('tipoDocumento').value = data.tipoDocumento;                        
                        //document.getElementById('digitoVerificador').value = data.digitoVerificador;
                    }
                })
                .catch(error => console.error('Error:', error));
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('patient-form').addEventListener('submit', function (event) {
                event.preventDefault(); // Evitar que la página se recargue

                // Recoger los datos del formulario
                const pacienteData = {
                    Nombres: document.getElementById('nombres').value,
                    ApellidoPaterno: document.getElementById('apellidoPaterno').value,
                    ApellidoMaterno: document.getElementById('apellidoMaterno').value,
                    DNI: document.getElementById('numeroDocumento').value,
                    Genero: document.getElementById('genero').value,
                    Direccion: document.getElementById('direccion').value,
                    Edad: document.getElementById('edad').value,
                    Celular: document.getElementById('celular').value,
                    FechaNacimiento: document.getElementById('fecha-nacimiento').value
                };

                // Enviar los datos mediante POST a la API
                fetch('http://localhost:5000/agregar_paciente', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(pacienteData)
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert("Paciente agregado exitosamente.");
                        } else {
                            alert("Error: " + data.error);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            });
        });
    </script>
