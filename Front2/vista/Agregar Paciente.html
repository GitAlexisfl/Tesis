<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policlínico Adrianzén</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/Front2/static/style/buscar_dni.css">
</head>

<body>
    <!-- Barra lateral -->
    <div class="d-flex">
        <div class="sidebar">
            <h2>Panel de Control</h2>
                <a href="main.html">Inicio</a>
                <a href="modulo_resumen_general.html">Resumen General</a>
                <a href="gestion_citas.html">Programar Citas</a>            
                <a href="Citas_del_dia.html">Mostrar Citas</a>
                <a href="modulo_reportes.html">Módulo de Reportes</a>     
                <!-- <a href="index.html">Registrar paciente</a> -->
                <a href="Lista de Pacientes.html">Historial de Pacientes</a>
                <a href="Agregar Paciente.html" class="active">Registrar Paciente</a>
        </div>
    </div>
    <!-- Contenido -->
     <div class="main-content">
    <div class="container">
        <main>
            <div class="card shadow">
                <div class="card-header text-center">
                    <h2>Buscar por DNI</h2>
                </div>
                <div class="card-body">
                    <form id="search-form" action="/pacientes/buscar" method="POST">
                        <div class="form-group">
                            <label for="dni">Número de DNI:</label>
                            <input type="text" id="dni" name="dni" class="form-control" placeholder="Ingrese el DNI"
                                required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Buscar</button>
                    </form>
                </div>
            </div>

            <!--<h1>Buscar Paciente</h1>-->
            <form id="patient-form" class="patient-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombres">Nombres:</label>
                        <input type="text" id="nombre" name="nombres" placeholder="Nombres">
                    </div>
                    <div class="form-group">
                        <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
                        <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="apellidoPaterno">Apellido Paterno:</label>
                        <input type="text" id="apellidoPaterno" name="apellidoPaterno" placeholder="Apellido Paterno">
                    </div>
                    <div class="form-group">
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad" placeholder="Edad">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="apellidoMaterno">Apellido Materno:</label>
                        <input type="text" id="apellidoMaterno" name="apellidoMaterno" placeholder="Apellido Materno">
                    </div>
                    <div class="form-group">
                        <label for="genero">Género:</label>
                        <input type="text" id="genero" name="genero" placeholder="Masculino/Femenino">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="numeroDocumento">DNI:</label>
                        <input type="text" id="numeroDocumento" name="numeroDocumento" placeholder="DNI">
                    </div>
                    <div class="form-group">
                        <label for="celular">Celular:</label>
                        <input type="text" id="celular" name="celular" placeholder="Celular">
                    </div>
                </div>
                <div class="form-group">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Dirección">
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn-actualizar">Actualizar</button>
                    <button type="submit" class="btn-guardar">Guardar</button>
                </div>
            </form>
                      
        </main>      
        
    </div></div>
    
    <!-- Scripts -->

    <script>
        document.getElementById('search-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const searchValue = document.getElementById('dni').value;

            fetch('http://127.0.0.1:5000/pacientes/buscar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `dni=${encodeURIComponent(searchValue)}`
            })
                .then(response => {
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        return response.json();
                    } else {
                        throw new Error('La respuesta no es JSON');
                    }
                })
                .then(data => {
                   

                    if (data.error) {
                        console.error(data.error);
                    } else {                               
                        document.getElementById('nombre').value = data.nombres;
                        document.getElementById('apellidoPaterno').value = data.apellidoPaterno;
                        document.getElementById('apellidoMaterno').value = data.apellidoMaterno;
                        document.getElementById('numeroDocumento').value = data.numeroDocumento;
                    }
                })
                .catch(error => console.error('Error:', error));
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('patient-form').addEventListener('submit', function (event) {
                event.preventDefault(); // Evitar que la página se recargue

                // Recoger los datos del formulario
                const pacienteData = {
                    Nombre: document.getElementById('nombre').value,
                    Apellido_Paterno: document.getElementById('apellidoPaterno').value,
                    Apellido_Materno: document.getElementById('apellidoMaterno').value,
                    DNI: document.getElementById('numeroDocumento').value,
                    Genero: document.getElementById('genero').value,
                    Direccion: document.getElementById('direccion').value,
                    Edad: document.getElementById('edad').value,
                    Celular: document.getElementById('celular').value,
                    Fecha_Nacimiento: document.getElementById('fecha-nacimiento').value
                };

                // Enviar los datos mediante POST a la API
                fetch('http://localhost:5000/agregar_paciente', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(pacienteData)
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert("Paciente agregado exitosamente.");
                        } else {
                            alert("Error: " + data.error);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            });
        });
    </script>

</body>

</html>
