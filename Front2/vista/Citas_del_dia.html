<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas del día</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/Front2/static/style/citas.css">
</head>


<body>
    <!-- Barra lateral -->
    <div class="d-flex">
        <div class="sidebar">
            <h2>Panel de Control</h2>
                <a href="main.html">Inicio</a>
                <a href="modulo_resumen_general.html">Resumen General</a>
                <a href="gestion_citas.html">Programar Citas</a>            
                <a href="Citas_del_dia.html" class="active">Mostrar Citas</a>
                <a href="modulo_reportes.html">Módulo de Reportes</a>     
                <!-- <a href="index.html">Registrar paciente</a> -->
                <a href="Lista de Pacientes.html">Historial de Pacientes</a>
                <a href="Agregar Paciente.html">Registrar Paciente</a>
        </div>
    </div>
    <!-- Contenido -->
     <div class="main-content">
    <div class="container">
        <main>
            <h1>Citas Agendadas</h1>

            <label for="fecha">Seleccionar Fecha:</label>
            <input type="date" id="fecha" name="fecha" value="">
            <button id="buscar-citas">Buscar Citas</button>

            <table>
                <thead>
                    <tr>                       
                        <th>Nombre</th>
                        <th>Apellido Paterno</th>
                        <th>Apellido Materno</th>
                        <th>Fecha_Cita</th>
                        <th>Hora_Cita</th>
                        <th>Descripcion</th>
                        <th>Cancelar</th>                
                    </tr>
                </thead>
                <tbody id="Citas">
                    <!-- Aquí se añadirán dinámicamente los datos -->                    
                   
                </tbody>
            </table>
        </main>        
    </div>    </div>

    <!-- Scripts -->   
    <script>
        document.getElementById('buscar-citas').addEventListener('click', function() {
            const fecha = document.getElementById('fecha').value;
            const url = `http://127.0.0.1:5000/citas/ver?fecha=${fecha}`;

            // Llamar a la API de Flask para obtener las citas
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('Citas');
                    tableBody.innerHTML = '';  // Limpiar el contenido existente

                    if (data.length > 0) {
                        data.forEach(cita => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                               
                                <td>${cita.Nombre}</td>
                                <td>${cita.Apellido_Paterno}</td>
                                <td>${cita.Apellido_Materno}</td>
                                <td>${cita.Fecha_Cita}</td>
                                <td>${cita.Hora_Cita}</td>
                                <td>${cita.Descripcion}</td>
                                <td><button onclick="cancelarCita(${cita.ID_Cita})">Cancelar</button></td>
                            `;
                            tableBody.appendChild(row);
                        });
                    } else {
                        tableBody.innerHTML = '<tr><td colspan="7">No hay citas para la fecha seleccionada</td></tr>';
                    }
                })
                .catch(error => console.error('Error:', error));                
        });

        // Función para cancelar una cita
        function cancelarCita(idCita) {
            fetch(`http://127.0.0.1:5000/citas/cancelar/${idCita}`, {
                method: 'PUT'
            })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    alert(data.message);
                    location.reload();  // Refrescar la página después de cancelar la cita
                } else {
                    alert(data.error || 'Error al cancelar la cita');
                }
            })
            .catch(error => console.error('Error:', error));
        }

        // Poner la fecha actual como valor predeterminado
        window.onload = function() {
            const today = new Date().toISOString().substr(0, 10);
            document.getElementById('fecha').value = today;
        };
    </script>

</body>

</html>
