<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Cita</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/Front2/static/style/buscar_dni.css">

    <style>
        /* Estilos para la barra lateral */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 220px;
            background-color: #343a40;
            padding-top: 20px;
            z-index: 1;
        }

        .sidebar h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar nav ul {
            list-style-type: none;
            padding: 0;
        }

        .sidebar nav ul li {
            text-align: center;
            margin-bottom: 15px;
        }

        .sidebar nav ul li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 0;
            font-size: 16px;
            background-color: transparent;
        }

        .sidebar nav ul li a.active {
            background-color: #007bff;
        }

        .sidebar nav ul li a:hover {
            background-color: #007bff;
        }

        /* Estilos para el contenido principal */
        .container {
            margin-left: 240px;
            padding: 20px;
        }

        .card {
            margin-top: 20px;
        }

        .card-header {
            background-color: #007bff;
            color: white;
        }

        /* Estilos del formulario */
        .patient-form {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .patient-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .patient-form input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
        }

        .buttons button {
            width: 48%;
        }

        /* Evita que la barra lateral deje un espacio en blanco al hacer scroll */
        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        .sidebar {
            height: 100vh;
            overflow: auto;
        }
    </style>

</head>

<body>
    <!-- Barra lateral -->
    <div class="sidebar">
        <h2>Panel de Control</h2>
        <nav>
            <ul>
                <li><a href="main.html">Inicio</a></li>
                <li><a href="modulo_resumen_general.html">Resumen General</a></li>
                <li><a href="gestion_citas.html">Gestión de Citas</a></li>
                <li><a href="historial_pacientes.html">Historial de Pacientes</a></li> 
                <li><a href="modulo_reportes.html">Módulo de Reportes</a></li>
                <li><a href="index.html">Registrar paciente</a></li>
                <li><a href="list.html">Pacientes registrados</a></li>
                <li><a href="Busqueda dni.html" class="active">Buscar datos</a></li>
            </ul>
        </nav>
    </div>
    <!-- Contenido -->
    <div class="container">
        <main>
            <div class="card shadow">
                <div class="card-header text-center">
                    <h2>Buscar por DNI</h2>
                </div>
                <div class="card-body">
                    <form id="search-form" action="/pacientes/buscarBD" method="POST">
                        <div class="form-group">
                            <label for="dni">Número de DNI:</label>
                            <input type="text" id="dni" name="dni" class="form-control" placeholder="Ingrese el DNI" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Buscar</button>
                    </form>
                </div>
            </div>

            <h1>Agendar Cita</h1>
            <form id="patient-form" class="patient-form">

                <label for="nombre">Nombres:</label>
                <input type="text" id="nombres" name="nombres" placeholder="Nombres">

                <label for="apellidoPaterno">Apellido Paterno:</label>
                <input type="text" id="apellidoPaterno" name="apellidoPaterno" placeholder="Apellido Paterno">

                <label for="apellidoMaterno">Apellido Materno:</label>
                <input type="text" id="apellidoMaterno" name="apellidoMaterno" placeholder="Apellido Materno">

                <label for="numeroDocumento">DNI:</label>
                <input type="text" id="numeroDocumento" name="numeroDocumento" placeholder="DNI">

                <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">

                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" placeholder="Edad">

                <label for="genero">Género:</label>
                <input type="text" id="genero" name="genero" placeholder="Masculino/Femenino">

                <label for="celular">Celular:</label>
                <input type="text" id="celular" name="celular" placeholder="Celular">             

                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" placeholder="Dirección">

                <label for="fechaCita">Fecha de la Cita:</label>
                <input type="date" id="fechaCita" name="fechaCita" required>

                <label for="horaCita">Hora de la Cita:</label>
                <input type="time" id="horaCita" name="horaCita" required>

                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" placeholder="Motivo de la cita"></textarea>

                <div class="buttons">
                    <button type="submit" class="btn-agendar">Agendar</button>
                </div>  
            </form>        
        </main>      
    </div>
    
    <!-- Scripts -->

    <script>
        document.getElementById('search-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const searchValue = document.getElementById('dni').value;

            fetch('http://127.0.0.1:5000/pacientes/buscarBD', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `dni=${encodeURIComponent(searchValue)}`
            })
                .then(response => {
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        return response.json();
                    } else {
                        throw new Error('La respuesta no es JSON');
                    }
                })
                .then(data => {
                    if (data.error) {
                        console.error(data.error);
                    } else {
                        document.getElementById('nombres').value = data.Nombre;
                        document.getElementById('apellidoPaterno').value = data.Apellido_Paterno;
                        document.getElementById('apellidoMaterno').value = data.Apellido_Materno;
                        document.getElementById('numeroDocumento').value = data.DNI;
                        document.getElementById('fecha-nacimiento').value = data.Fecha_Nacimiento;
                        document.getElementById('genero').value = data.Genero;
                        document.getElementById('direccion').value = data.Direccion;
                        document.getElementById('edad').value = data.Edad;
                        document.getElementById('celular').value = data.Celular;
                    }
                })
                .catch(error => console.error('Error:', error));
        });

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('patient-form').addEventListener('submit', function (event) {
                event.preventDefault(); // Evitar que la página se recargue

                // Recoger los datos del formulario
                const citaData = {
                    DNI: document.getElementById('numeroDocumento').value,
                    Fecha_Cita: document.getElementById('fechaCita').value,
                    Hora_Cita: document.getElementById('horaCita').value,
                    Descripcion: document.getElementById('descripcion').value
                };

                // Enviar los datos mediante POST a la API para agendar la cita
                fetch('http://localhost:5000/citas/agendar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(citaData)
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert("Cita agendada exitosamente.");
                        } else {
                            alert("Error: " + data.error);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            });
        });
    </script>

</body>

</html>
